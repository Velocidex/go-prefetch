name: Test
on: [pull_request]
jobs:
  build:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go 1.25
      uses: actions/setup-go@v2
      with:
        go-version: 1.25
      id: go

    - name: Check out code into the Go module directory
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      with:
         submodules: true

    - name: Test
      run: |
        go test -v -race ./...
